spring.application.name=orders

spring.datasource.url=jdbc:postgresql://localhost:5433/orders
spring.datasource.username=lab
spring.datasource.password=lab

server.port=8090

# Kafka configuration
spring.kafka.properties.schema.registry.url=http://localhost:8081
spring.kafka.bootstrap-servers=localhost:9092

# producer
spring.kafka.producer.properties.auto.register.schemas=true
spring.kafka.producer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.TopicRecordNameStrategy
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=8000
spring.kafka.producer.properties.request.timeout.ms=5000

# consumer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.consumer.group-id=orders-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.listener.ack-mode=record

# topics
outbox.topic=orders
orders.stock-events.topic=stock-events
orders.stock-events.dlt-topic=stock-events-dlt

#ms
outbox.relay.interval-ms=1000
outbox.relay.batch-size=100
outbox.relay.send-timeout-ms=10000